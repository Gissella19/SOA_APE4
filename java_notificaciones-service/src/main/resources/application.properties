spring.application.name=notificaciones-service
server.port=8081
server.address=127.0.0.1

# Conexión MySQL compartida con venta_vehiculos para persistir notificaciones consumidas
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/venta_vehiculos?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Configuración del broker RabbitMQ y cola durable
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.missing-queues-fatal=false
app.rabbitmq.queue=notificaciones.ventas

# Clave compartida X-Notification-Key utilizada por Java y Python para envíos REST directos
app.notificacion-key=avisos-java-python-aula-2026-key-7G5nP3rQ8c6L2t
